[project]
name = "holo-playground"
version = "0.1.0"
description = "Accuracy vs. latency of Holo GUI-grounding models running locally on llama.cpp"
readme = "README.md"
authors = [
    { name = "noech373" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "openai>=3.52.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
]

[project.scripts]
holo-locate = "holo_playground.locate:main"
holo-sweep = "holo_playground.sweep:main"
holo-report = "holo_playground.report:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
