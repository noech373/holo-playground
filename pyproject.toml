[project]
name = "holo-playground"
version = "0.1.0"
description = "Holo 3.1 on a laptop CPU: GUI-grounding accuracy vs. image budget, and a web agent built from scratch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "noech373" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "openai>=3.52.0",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
]

[project.scripts]
holo-locate = "holo_playground.locate:main"
holo-sweep = "holo_playground.sweep:main"
holo-report = "holo_playground.report:main"
holo-serve = "holo_playground.server:main"
holo-agent = "holo_playground.agent.run:main"
holo-agent-report = "holo_playground.agent.report:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is sent verbatim: rewrapping it would change what the model reads.
"src/holo_playground/agent/policy.py" = ["E501"]
